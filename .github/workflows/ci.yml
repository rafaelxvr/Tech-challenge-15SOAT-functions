name: Verify

permissions:
  contents: read

concurrency:
  group: functions-verify-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]


jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: ./mvnw -B verify
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8
          terraform_wrapper: false
      - name: Verify source-only infrastructure and inert deployment contracts
        shell: pwsh
        run: ./tests/verify-infrastructure.ps1

  deploy-staging:
    name: deploy-staging
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: verify
    runs-on: ubuntu-24.04
    environment: staging
    concurrency:
      group: phase3-functions-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    env:
      DEPLOY_ENVIRONMENT: staging
      ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}
      SOURCE_PREFIX: ${{ vars.SOURCE_PREFIX }}
      CODEBUILD_PROJECT: ${{ vars.CODEBUILD_PROJECT }}
      DEPLOYER_IMAGE_DIGEST: ${{ vars.DEPLOYER_IMAGE_DIGEST }}
      STATE_BUCKET: ${{ vars.STATE_BUCKET }}
      AWS_LAUNCHER_ROLE_ARN: ${{ vars.AWS_LAUNCHER_ROLE_ARN }}
      CLOUD_WINDOW_EVIDENCE_JSON: ${{ secrets.CLOUD_WINDOW_EVIDENCE_JSON }}
      TERRAFORM_TFVARS_JSON: ${{ secrets.TERRAFORM_TFVARS_JSON }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate branch and event before requesting identity
        shell: pwsh
        run: ./scripts/check-workflow-context.ps1 -Environment staging
      - name: Require reviewed staging configuration
        shell: bash
        run: |
          set -euo pipefail
          required=(ARTIFACT_BUCKET SOURCE_PREFIX CODEBUILD_PROJECT DEPLOYER_IMAGE_DIGEST STATE_BUCKET AWS_LAUNCHER_ROLE_ARN CLOUD_WINDOW_EVIDENCE_JSON TERRAFORM_TFVARS_JSON)
          for variable in "${required[@]}"; do
            test -n "${!variable:-}" || { echo "Missing reviewed staging configuration: ${variable}"; exit 1; }
          done
      - name: Assume staging launcher role with OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_LAUNCHER_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: phase3-functions-staging
      - name: Create immutable release manifest
        shell: pwsh
        run: |
          $sourceSha = ./scripts/package-source.ps1 -SourceCommit $env:GITHUB_SHA -OutputFile "$env:RUNNER_TEMP/bundle.zip"
          $manifest = [ordered]@{ schemaVersion = 1; environment = 'staging'; sourceCommit = $env:GITHUB_SHA; artifactSha256 = $sourceSha; deployerImageDigest = "sha256:$env:DEPLOYER_IMAGE_DIGEST"; contractVersion = 'phase3-v2'; migrationVersion = 'V8'; promotedFromStaging = $false }
          $manifest | ConvertTo-Json | Set-Content -LiteralPath "$env:RUNNER_TEMP/release-manifest.json" -NoNewline
          "SOURCE_SHA256=$sourceSha" >> $env:GITHUB_ENV
          "MANIFEST_SHA256=$((Get-FileHash -LiteralPath "$env:RUNNER_TEMP/release-manifest.json" -Algorithm SHA256).Hash.ToLowerInvariant())" >> $env:GITHUB_ENV
      - name: Launch and wait for private staging executor
        shell: pwsh
        run: |
          $evidence = Join-Path $env:RUNNER_TEMP 'cloud-window.json'
          $tfvars = Join-Path $env:RUNNER_TEMP 'functions_staging.tfvars.json'
          Set-Content -LiteralPath $evidence -NoNewline -Value $env:CLOUD_WINDOW_EVIDENCE_JSON
          Set-Content -LiteralPath $tfvars -NoNewline -Value $env:TERRAFORM_TFVARS_JSON
          ./scripts/start-deploy.ps1 -Environment staging -SourceZip "$env:RUNNER_TEMP/bundle.zip" -ExpectedSha256 $env:SOURCE_SHA256 -ReleaseManifest "$env:RUNNER_TEMP/release-manifest.json" -ExpectedManifestSha256 $env:MANIFEST_SHA256 -Bucket $env:ARTIFACT_BUCKET -SourcePrefix $env:SOURCE_PREFIX -ProjectName $env:CODEBUILD_PROJECT -DeployerImageDigest $env:DEPLOYER_IMAGE_DIGEST -SourceCommit $env:GITHUB_SHA -CloudWindowEvidenceFile $evidence -TerraformVariablesFile $tfvars -StateBucket $env:STATE_BUCKET -ResultOutputFile "$env:RUNNER_TEMP/staging-deployment-result.json"

  production-contract:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.FUNCTIONS_PRODUCTION_DEPLOYMENT_ENABLED == 'true'
    environment:
      name: production
    needs: verify
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v4

      - name: Require reviewed input artifact identity
        shell: pwsh
        env:
          FUNCTIONS_PRODUCTION_INPUTS_RUN_ID: ${{ vars.FUNCTIONS_PRODUCTION_INPUTS_RUN_ID }}
          FUNCTIONS_PRODUCTION_INPUTS_ARTIFACT_ID: ${{ vars.FUNCTIONS_PRODUCTION_INPUTS_ARTIFACT_ID }}
        run: |
          foreach ($value in @($env:FUNCTIONS_PRODUCTION_INPUTS_RUN_ID, $env:FUNCTIONS_PRODUCTION_INPUTS_ARTIFACT_ID)) {
            if ($value -cnotmatch '\A[1-9][0-9]*\z') { throw 'Reviewed production input artifact identity is required.' }
          }

      - name: Download reviewed public input artifact
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ vars.FUNCTIONS_PRODUCTION_INPUTS_RUN_ID }}
          artifact-ids: ${{ vars.FUNCTIONS_PRODUCTION_INPUTS_ARTIFACT_ID }}
          merge-multiple: true
          path: ${{ runner.temp }}/functions-production-review

      - name: Validate production promotion without cloud credentials
        shell: pwsh
        env:
          FUNCTIONS_PRODUCTION_DEPLOYMENT_ENABLED: ${{ vars.FUNCTIONS_PRODUCTION_DEPLOYMENT_ENABLED }}
          FUNCTIONS_PRODUCTION_LAUNCHER_ENABLED: ${{ vars.FUNCTIONS_PRODUCTION_LAUNCHER_ENABLED }}
          FUNCTIONS_PRODUCTION_ROLE_ARN: ${{ vars.FUNCTIONS_PRODUCTION_ROLE_ARN }}
          FUNCTIONS_PRODUCTION_INPUTS_SHA256: ${{ vars.FUNCTIONS_PRODUCTION_INPUTS_SHA256 }}
        run: |
          & ./scripts/check-production-promotion.ps1 `
            -Enabled $env:FUNCTIONS_PRODUCTION_DEPLOYMENT_ENABLED `
            -LauncherEnabled $env:FUNCTIONS_PRODUCTION_LAUNCHER_ENABLED `
            -RoleArn $env:FUNCTIONS_PRODUCTION_ROLE_ARN `
            -InputsFile (Join-Path $env:RUNNER_TEMP 'functions-production-review/production-inputs.json') `
            -ExpectedInputsSha256 $env:FUNCTIONS_PRODUCTION_INPUTS_SHA256 `
            -SourceCommit $env:GITHUB_SHA `
            -EventName $env:GITHUB_EVENT_NAME `
            -BranchRef $env:GITHUB_REF
          # Contract validation never obtains cloud identity or executes apply.

      - name: Preflight explicitly selected production executor
        if: vars.FUNCTIONS_PRODUCTION_LAUNCHER_ENABLED == 'true'
        shell: pwsh
        env:
          FUNCTIONS_PRODUCTION_DEPLOYMENT_ENABLED: ${{ vars.FUNCTIONS_PRODUCTION_DEPLOYMENT_ENABLED }}
          FUNCTIONS_PRODUCTION_LAUNCHER_ENABLED: ${{ vars.FUNCTIONS_PRODUCTION_LAUNCHER_ENABLED }}
          FUNCTIONS_PRODUCTION_ROLE_ARN: ${{ vars.FUNCTIONS_PRODUCTION_ROLE_ARN }}
          FUNCTIONS_PRODUCTION_INPUTS_SHA256: ${{ vars.FUNCTIONS_PRODUCTION_INPUTS_SHA256 }}
        run: |
          & ./scripts/deploy-production.ps1 `
            -Enabled $env:FUNCTIONS_PRODUCTION_DEPLOYMENT_ENABLED `
            -LauncherEnabled $env:FUNCTIONS_PRODUCTION_LAUNCHER_ENABLED `
            -ProtectedEnvironment production -RoleArn $env:FUNCTIONS_PRODUCTION_ROLE_ARN `
            -InputsFile (Join-Path $env:RUNNER_TEMP 'functions-production-review/production-inputs.json') `
            -ExpectedInputsSha256 $env:FUNCTIONS_PRODUCTION_INPUTS_SHA256 `
            -SourceCommit $env:GITHUB_SHA -EventName $env:GITHUB_EVENT_NAME -BranchRef $env:GITHUB_REF
          # No apply switch and no production AWS/OIDC credentials.
